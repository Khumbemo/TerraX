# Serves the built app and proxies /api to the TerraX API (service "api").
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads (GeoTIFFs can be large); keep in step with TERRAX_MAX_UPLOAD_MB.
    client_max_body_size 500m;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Hashed build files never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and app shell must be revalidated so updates arrive.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
