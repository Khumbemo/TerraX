# Render Blueprint: TerraX as one web service built from the root Dockerfile.
# Deploy: https://render.com/deploy?repo=https://github.com/Khumbemo/TerraX
services:
  - type: web
    name: terrax
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The free plan (512 MB, sleeps after 15 idle minutes) runs the samples; large rasters need a paid plan.
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # One analysis at a time keeps memory within the free plan.
      - key: TERRAX_JOB_THREADS
        value: "1"
      # 512 MB: full resolution up to 20 MP, one strip at a time.
      - key: TERRAX_MAX_PIXELS
        value: "20000000"
      - key: TERRAX_TILE_THREADS
        value: "1"
      # Hydrology needs about 100 bytes per DEM pixel, so 4 MP fits 512 MB.
      - key: TERRAX_DEM_PIXELS
        value: "4000000"
      - key: TERRAX_MAX_UPLOAD_MB
        value: "100"
      - key: TERRAX_RETENTION_HOURS
        value: "24"
      # Optional: server-side Gemini key for the AI assistants (entered in the Render dashboard, never stored here).
      - key: GEMINI_API_KEY
        sync: false
      # A public URL: everyone signs in (accounts are free to create; TERRAX_SIGNUP=closed for invitation only).
      - key: TERRAX_AUTH
        value: required
      # The first administrator, created at start-up (entered in the dashboard).
      - key: TERRAX_ADMIN_EMAIL
        sync: false
      - key: TERRAX_ADMIN_PASSWORD
        sync: false
      # The free plan's disk is wiped on every deploy and restart, and with it the built-in SQLite database (accounts,
      # history, projects). For accounts that last, point this at PostgreSQL, e.g. a Render PostgreSQL instance's
      # internal URL written as postgresql+psycopg://USER:PASSWORD@HOST/DB.
      - key: DATABASE_URL
        sync: false
      # Optional, instead of (or as well as) PostgreSQL: an S3-compatible bucket (Cloudflare R2 and Backblaze B2 have free
      # tiers) keeps uploads and results, and hourly database backups that an empty database restores at start-up, so
      # a restart loses at most the last hour.
      - key: TERRAX_S3_BUCKET
        sync: false
      - key: TERRAX_S3_ENDPOINT
        sync: false
      - key: TERRAX_S3_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: TERRAX_BACKUP_HOURS
        value: "1"
      - key: TERRAX_BACKUP_RESTORE_EMPTY
        value: "true"
      # Signs links to result pictures and tiles; generated once by Render so it survives restarts.
      - key: TERRAX_SECRET_KEY
        generateValue: true
      # Optional: password-reset e-mail (all of the SMTP settings and the public address of the service).
      - key: TERRAX_PUBLIC_URL
        sync: false
      - key: TERRAX_SMTP_HOST
        sync: false
      - key: TERRAX_SMTP_USER
        sync: false
      - key: TERRAX_SMTP_PASSWORD
        sync: false
      - key: TERRAX_SMTP_FROM
        sync: false
      # Optional: single sign-on (OpenID Connect).
      - key: TERRAX_OIDC_ISSUER
        sync: false
      - key: TERRAX_OIDC_CLIENT_ID
        sync: false
      - key: TERRAX_OIDC_CLIENT_SECRET
        sync: false
      # Optional error tracking (Sentry or a compatible service) and a token for Prometheus at /api/metrics.
      - key: SENTRY_DSN
        sync: false
      - key: TERRAX_METRICS_TOKEN
        sync: false
      - key: TERRAX_LOG_FORMAT
        value: json
