name: Live data

# The Sentinel-1 and Landsat (Planetary Computer) and Sentinel-2 (Earth Search) catalogues, for real. Separate from CI because it
# depends on outside services: weekly, by hand, and when the code that talks to them changes.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - backend/terrax/services/live.py
      - backend/terrax/tools/sentinel.py
      - backend/terrax/api/live.py
      - backend/tests/test_live.py
      - backend/terrax/services/earth.py
      - backend/tests/test_earth_live.py
      - .github/workflows/live.yml

permissions:
  contents: read

jobs:
  live:
    name: Sentinel-1, Sentinel-2 and Landsat, live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Search, read and analyse live scenes
        env:
          TERRAX_LIVE: '1'
        run: pytest -p no:warnings tests/test_live.py -v
      # USGS, Open-Meteo and FIRMS. The FIRMS Area API test runs only if the repository has a FIRMS_MAP_KEY secret.
      - name: Earthquakes, fires, weather and elevation, live
        if: success() || failure()  # independent of the catalogues above
        env:
          TERRAX_LIVE: '1'
          TERRAX_FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: pytest -p no:warnings tests/test_earth_live.py -v -rs
