name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Python API and processing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Lint (ruff)
        run: ruff check terrax scripts tests
      - name: Type-check (mypy)
        run: mypy
      - name: Tests (pytest)
        run: pytest -p no:warnings
      # The bucket tests again, against a real S3-compatible server instead of moto (MinIO no longer publishes
      # community images). Small, unpreallocated volumes keep it within the runner's disk.
      - name: Object storage against SeaweedFS
        env:
          TERRAX_TEST_S3_ENDPOINT: http://127.0.0.1:8333
        run: |
          docker run -d --name s3 --network host chrislusf/seaweedfs:3.80 server -ip=127.0.0.1 -s3 -dir=/data \
            -master.volumeSizeLimitMB=64 -master.volumePreallocate=false -volume.max=20
          for i in $(seq 1 90); do curl -s -o /dev/null http://127.0.0.1:8333/ && break; sleep 1; done
          pytest -p no:warnings tests/test_objectstore.py

  backend-postgres:
    name: Python API on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: terrax
          POSTGRES_PASSWORD: terrax
          POSTGRES_DB: terrax
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U terrax" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://terrax:terrax@localhost:5432/terrax
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev,postgres]'
      - name: Accounts, access, history and the API on PostgreSQL
        run: pytest -p no:warnings tests/test_accounts.py tests/test_api.py tests/test_tools.py tests/test_hosting.py tests/test_maptiles.py tests/test_backup.py tests/test_objectstore.py tests/test_interrupted.py

  qgis-plugin:
    name: QGIS plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # The terrax command in its own environment (as users install it); QGIS's Python runs the plugin and its tests.
      - run: pip install -e backend
      - name: QGIS 3.34 LTR (Ubuntu's)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-qgis qgis-providers
      - name: Plugin tests in headless QGIS
        env:
          QT_QPA_PLATFORM: offscreen
        run: TERRAX_COMMAND="$(which terrax)" /usr/bin/python3 -W error::ResourceWarning -m unittest discover -s qgis-plugin/tests -v
      - run: python qgis-plugin/build.py

  clients:
    name: R and Julia clients
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e backend
      - name: R (Ubuntu's, with jsonlite and terra)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends r-base-core r-cran-jsonlite r-cran-terra
      - name: R client
        run: Rscript clients/R/terrax/tests/run_tests.R && R CMD INSTALL -l "$RUNNER_TEMP" clients/R/terrax
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Julia client
        run: julia --project=clients/julia/TerraX -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  frontend:
    name: Web app and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the API (the end-to-end tests run against it)
        run: pip install ../backend
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (real API, jobs in-process)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  docker:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the compose stack
        run: docker compose build
      - name: Start it and check the API through nginx
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS -o /tmp/health.json http://localhost:8080/api/health && grep -q '"redis":true' /tmp/health.json; then
              cat /tmp/health.json
              # PostgreSQL, the shared storage volume and Redis all answer.
              curl -fsS http://localhost:8080/api/health/ready | tee /tmp/ready.json | grep -q '"ok":true'
              # A guest's job runs on a worker and its result is only readable with the guest's cookie.
              curl -fsS -c /tmp/jar -b /tmp/jar -X POST -H 'Content-Type: application/json' -d '{"name":"terrain_dem_synthetic.tif"}' http://localhost:8080/api/samples > /tmp/file.json
              fid=$(python3 -c "import json; print(json.load(open('/tmp/file.json'))['id'])")
              test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/files/$fid)" = 404
              test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/jar http://localhost:8080/api/files/$fid)" = 200
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy through nginx" >&2
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - run: docker compose down -v
        if: always()

  onebox:
    name: One-container image (Render, Hugging Face)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the root Dockerfile
        run: docker build -t terrax-onebox .
      - name: Start it as Render would (PORT set by the host) and check the app and API
        run: |
          docker run -d --name onebox -p 8090:10000 -e PORT=10000 terrax-onebox
          for i in $(seq 1 60); do
            if curl -fsS -o /tmp/health.json http://localhost:8090/api/health && grep -q '"jobs":"threads"' /tmp/health.json; then
              cat /tmp/health.json
              curl -fsS http://localhost:8090/ | grep -q '<div id="root"'
              curl -fsS -X POST -H 'Content-Type: application/json' -d '{"name":"terrain_dem_synthetic.tif"}' http://localhost:8090/api/samples | grep -q '"kind":"raster"'
              exit 0
            fi
            sleep 2
          done
          echo "The one-container image did not become healthy" >&2
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker logs onebox --tail 100
