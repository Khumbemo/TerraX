[project]
name = "terrax"
version = "2.0.0"
description = "TerraX earth-observation workbench: FastAPI API, Celery workers and Python processing."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "celery[redis]>=5.4",
  "redis>=5",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "rasterio>=1.3",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "shapely>=2.0",
  "pyproj>=3.6",
  "scikit-learn>=1.4",
  "pillow>=10",
  "httpx>=0.27",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["terrax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
