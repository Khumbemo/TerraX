[project]
name = "terrax"
version = "2.0.0"
description = "TerraX earth-observation workbench: FastAPI API, Celery workers and Python processing."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "celery[redis]>=5.4",
  "redis>=5",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "rasterio>=1.3",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "shapely>=2.0",
  "pyproj>=3.6",
  "scikit-learn>=1.4",
  "laspy[lazrs]>=2.5",
  "numba>=0.59",
  "pillow>=10",
  "httpx>=0.27",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["terrax*"]

[tool.setuptools.package-data]
terrax = ["agents/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # A NaN or overflow in TerraX's own maths fails the test instead of passing quietly.
    "error::RuntimeWarning:terrax",
    # rasterio's own transform helpers still use the Affine * operator (affine 2.4 deprecation); not TerraX code.
    "ignore:Use `@` matmul instead of `\\*` mul operator:PendingDeprecationWarning:rasterio",
    # rasterize() builds an in-memory dataset and reads its transform before setting it; harmless (strip masks are tested equal to whole-grid masks).
    "ignore:Dataset has no geotransform:rasterio.errors.NotGeoreferencedWarning:rasterio",
]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
# Errors, likely bugs and modern syntax. Lambdas and short maths names (l, I, O) are kept where they read like the formulas.
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "PLW", "I"]
ignore = ["E501", "E731", "E741", "B008", "PLW2901", "PLW0603", "RUF001", "RUF002", "RUF003", "SIM108", "SIM102", "SIM105", "SIM115", "SIM116", "SIM300", "SIM905"]

[tool.mypy]
python_version = "3.11"
packages = ["terrax"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# rasterio, GeoPandas, numba, SciPy, scikit-learn, Celery and others ship without type stubs.
ignore_missing_imports = true
